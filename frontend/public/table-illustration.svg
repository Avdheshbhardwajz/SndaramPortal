<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Database stack with search icon -->
  <g opacity="0.8">
    <!-- Bottom database -->
    <rect x="80" y="140" width="80" height="30" rx="4" fill="#E5E7EB"/>
    <circle cx="100" y="155" r="4" fill="#9CA3AF"/>
    <circle cx="120" y="155" r="4" fill="#9CA3AF"/>
    <circle cx="140" y="155" r="4" fill="#9CA3AF"/>
    
    <!-- Middle database -->
    <rect x="80" y="100" width="80" height="30" rx="4" fill="#E5E7EB"/>
    <circle cx="100" y="115" r="4" fill="#9CA3AF"/>
    <circle cx="120" y="115" r="4" fill="#9CA3AF"/>
    <circle cx="140" y="115" r="4" fill="#9CA3AF"/>
    
    <!-- Top database -->
    <rect x="80" y="60" width="80" height="30" rx="4" fill="#E5E7EB"/>
    <circle cx="100" y="75" r="4" fill="#9CA3AF"/>
    <circle cx="120" y="75" r="4" fill="#9CA3AF"/>
    <circle cx="140" y="75" r="4" fill="#9CA3AF"/>
    
    <!-- Search icon -->
    <g transform="translate(140, 40) rotate(-15)">
      <circle cx="20" cy="20" r="15" stroke="#9CA3AF" stroke-width="3" fill="none"/>
      <line x1="31" y1="31" x2="40" y2="40" stroke="#9CA3AF" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
